name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5


      - run: pnpm install

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --audit-level=high || true
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - run: pnpm test
      - run: pnpm build
