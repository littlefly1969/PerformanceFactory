<VirtualHost *:80>
    ServerName performancefactory.littlefly.it
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,R=301]

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/performancefactory-littlefly-error.log
    CustomLog ${APACHE_LOG_DIR}/performancefactory-littlefly-access.log combined
</VirtualHost>
