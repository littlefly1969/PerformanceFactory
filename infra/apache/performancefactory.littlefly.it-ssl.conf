<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName performancefactory.littlefly.it

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-SSL "on"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPass /api http://127.0.0.1:4100/api
    ProxyPassReverse /api http://127.0.0.1:4100/api

    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog ${APACHE_LOG_DIR}/performancefactory-littlefly-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/performancefactory-littlefly-ssl-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/performancefactory.littlefly.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/performancefactory.littlefly.it/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
