name: ${TEST_COMPOSE_PROJECT_NAME:-performancefactory-test}

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: performancefactory_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d performancefactory_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test]

  api-tests:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: test
    environment:
      NODE_ENV: test
      AI_PROVIDER: stub
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/performancefactory_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/performancefactory_test
    depends_on:
      postgres:
        condition: service_healthy
    networks: [test]

networks:
  test:
    internal: true
