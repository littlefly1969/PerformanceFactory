name: ${COMPOSE_PROJECT_NAME:-performancefactory}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

x-restart-policy: &default-restart-policy
  restart: unless-stopped

services:
  api:
    <<: *default-restart-policy
    image: ${API_IMAGE:-performancefactory-api:${IMAGE_TAG:-local}}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_SESSION_PREFIX: ${REDIS_SESSION_PREFIX:-pf:sess:}
      PF4_SPORT_MODE: ${PF4_SPORT_MODE:-fixed}
      PF4_SPORT_KEY: ${PF4_SPORT_KEY:-PADEL}
      PF4_SPECIALIZATION_KEY: ${PF4_SPECIALIZATION_KEY:-STANDARD}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_MODEL_PROPOSAL: ${AI_MODEL_PROPOSAL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_MODEL_PROPOSAL: ${GEMINI_MODEL_PROPOSAL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DEBUG_PROMPT_LOG: ${AI_DEBUG_PROMPT_LOG:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      API_VERSION: ${API_VERSION:-0.1.0}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:-}
      GOOGLE_OIDC_HOSTED_DOMAIN: ${GOOGLE_OIDC_HOSTED_DOMAIN:-}
      GOOGLE_OIDC_AUTO_LINK_VERIFIED_EMAIL: ${GOOGLE_OIDC_AUTO_LINK_VERIFIED_EMAIL:-false}
      WEB_LOGIN_SUCCESS_URL: ${WEB_LOGIN_SUCCESS_URL:-}
      WEB_LOGIN_FAILURE_URL: ${WEB_LOGIN_FAILURE_URL:-}
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend
      - public

  web:
    <<: *default-restart-policy
    image: ${WEB_IMAGE:-performancefactory-web:${IMAGE_TAG:-local}}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/login'').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - public

  migrate:
    image: ${API_IMAGE:-performancefactory-api:${IMAGE_TAG:-local}}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    logging: *default-logging
    networks:
      - backend
      - public

  postgres:
    <<: *default-restart-policy
    profiles: [local-db]
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-performancefactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-performancefactory}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend

  redis:
    <<: *default-restart-policy
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
    internal: true
  public:
