services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      REDIS_URL: ${REDIS_URL}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_MODEL_PROPOSAL: ${AI_MODEL_PROPOSAL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_MODEL_PROPOSAL: ${GEMINI_MODEL_PROPOSAL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DEBUG_PROMPT_LOG: ${AI_DEBUG_PROMPT_LOG:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
